<div class="row mx-0">
  <div *ngFor="let p of posts" class="col-4 px-0">
    <div class="card">
      <div class="card-img-wrapper">
        <img class="card-img" src={{p.post_Img}} alt="card" />
      </div>
      <div class="card-body px-0">
        <h3 class="card-title">{{ p.title }}</h3>
        <p class="card-text mb-1">
          {{ p.content }} ...<a href="#"> read more </a>
        </p>
        <p class="mb-0 author">{{ p.author }}</p>
      </div>
    </div>
  </div>
</div>
